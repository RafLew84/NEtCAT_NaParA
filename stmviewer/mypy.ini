[mypy]
python_version = 3.12
strict = True
files = stmviewer
cache_dir = .mypy_cache/stmviewer

[mypy-napara.*]
follow_imports = skip

[mypy-nanotrack.*]
follow_imports = skip

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-torch.*,kornia.*]
follow_imports = skip
ignore_missing_imports = True
