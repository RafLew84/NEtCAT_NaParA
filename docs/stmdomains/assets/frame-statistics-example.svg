<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="670" viewBox="0 0 1060 670" role="img" aria-labelledby="title desc">
<title id="title">Przykład statystyk jednej klatki STM Domains</title>
<desc id="desc">Oryginalne pole 100 na 100 pikseli, powiększone płótno 150 na 120. Dwie wyspy zajmują 6000 pikseli kwadratowych. Dwa fragmenty typu A zajmują łącznie 3000, typ B 1000, domena bez typu 600. Reszta materiału obejmuje brak porządku, niejednoznaczność i brak danych. Schemat ilustruje definicje, nie wynik detekcji.</desc>
<defs><pattern id="padding" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e9edf2"/><path d="M0 12L12 0" stroke="#cdd4dd"/></pattern></defs>
<rect width="1060" height="670" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#26354a">
<text x="30" y="35" font-size="24" font-weight="bold">Jedna klatka: powierzchnie i widoczne fragmenty</text>
<text x="30" y="61" font-size="15">Schemat definicji — nie wynik detekcji ani referencja STM.</text>
<rect x="40" y="90" width="600" height="480" fill="url(#padding)" stroke="#8290a2"/>
<rect x="80" y="130" width="400" height="400" fill="white" stroke="#26354a" stroke-width="2"/>

<rect x="80" y="130" width="240" height="120" fill="#6faed3" stroke="white" stroke-width="1"/>
<rect x="380" y="210" width="80" height="240" fill="#6faed3" stroke="white" stroke-width="1"/>
<rect x="120" y="250" width="200" height="80" fill="#e5b95f" stroke="white" stroke-width="1"/>
<rect x="80" y="330" width="80" height="120" fill="#a69bcc" stroke="white" stroke-width="1"/>
<rect x="160" y="330" width="80" height="120" fill="#a6c5a0" stroke="white" stroke-width="1"/>
<rect x="80" y="250" width="40" height="80" fill="#e5a2b9" stroke="white" stroke-width="1"/>
<rect x="240" y="410" width="80" height="40" fill="#e5a2b9" stroke="white" stroke-width="1"/>
<rect x="240" y="330" width="80" height="80" fill="#c4cad1" stroke="white" stroke-width="1"/>
<rect x="80" y="130" width="240" height="320" fill="none" stroke="#304353" stroke-width="2"/>
<rect x="380" y="210" width="80" height="240" fill="none" stroke="#304353" stroke-width="2"/>
<g text-anchor="middle" font-size="16">
<text x="200" y="181">A₁ · 1800 px²</text><text x="200" y="202" font-size="13">ucięty brzegiem</text>
<text x="420" y="310">A₂</text><text x="420" y="334" font-size="13">1200 px²</text>
<text x="220" y="298">B · 1000 px²</text>
<text x="120" y="382">U</text><text x="120" y="403" font-size="13">600 px²</text>
<text x="200" y="382">D</text><text x="200" y="403" font-size="13">600 px²</text>
<text x="280" y="372">I</text><text x="100" y="296">X</text><text x="280" y="436">X</text>
</g>
<text x="100" y="497" font-size="16">Oryginalne pole: 10 000 px²</text>
<text x="65" y="553" font-size="15">Dopełnienie: 8000 px² — poza pomiarem</text>
<text x="685" y="112" font-size="19" font-weight="bold">Pokrycie: 6000 px² = 60% pola</text>
<text x="685" y="142" font-size="16">2 wyspy, 4 rozpoznane fragmenty domen.</text>
<text x="685" y="167" font-size="15">A₁ i U są ucięte brzegiem.</text>
<text x="685" y="192" font-size="15">Ocena domen jest częściowa.</text>

<rect x="685" y="220" width="20" height="20" fill="#6faed3"/><text x="718" y="235" font-size="15">Typ A: 30% pola / 50% warstwy</text>
<rect x="685" y="259" width="20" height="20" fill="#e5b95f"/><text x="718" y="274" font-size="15">Typ B: 10% pola / 16,67% warstwy</text>
<rect x="685" y="298" width="20" height="20" fill="#a69bcc"/><text x="718" y="313" font-size="15">Domena bez typu: 600 px²</text>
<rect x="685" y="337" width="20" height="20" fill="#a6c5a0"/><text x="718" y="352" font-size="15">Brak wykrytego porządku: 600 px²</text>
<rect x="685" y="376" width="20" height="20" fill="#e5a2b9"/><text x="718" y="391" font-size="15">Niejednoznaczność: 400 px²</text>
<rect x="685" y="415" width="20" height="20" fill="#c4cad1"/><text x="718" y="430" font-size="15">Niewystarczające dane: 400 px²</text>
<text x="685" y="499" font-size="15">Białe pole: podłoże, 4000 px².</text>
<text x="685" y="525" font-size="15">Niepewność nie zmniejsza mianowników,</text>
<text x="685" y="547" font-size="15">jeżeli sama powierzchnia warstwy jest znana.</text>
<text x="30" y="615" font-size="16">Rozłączne fragmenty A₁ i A₂ mają ten sam typ. Nie łączymy ich przez nieobserwowany obszar.</text>
<text x="30" y="642" font-size="16">Nie dopowiadamy pełnej powierzchni domen uciętych brzegiem. Gamma i zoom nie zmieniają wartości.</text>
</g></svg>
